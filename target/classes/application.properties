# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/lsnls?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=capote
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
logging.level.org.hibernate.type=ERROR
logging.level.org.hibernate=ERROR

# No ejecutar data.sql automáticamente al arrancar
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:data.sql
# Asegura que JPA cree/actualice el esquema antes de ejecutar data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
# Propiedades usadas por JwtService y SessionValidationService
application.security.jwt.secret-key=lsnls2024SecretKeyForJWTTokenGenerationAndValidationSecureKey
application.security.jwt.expiration=86400000

# Server Configuration
# Servidor en HTTP plano para desarrollo local
server.port=8080
server.ssl.enabled=false

# Upload Configuration
upload.directory=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Spring Boot DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.lsnls=INFO
